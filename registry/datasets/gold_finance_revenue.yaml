id: gold.finance_revenue
name: Finance revenue reporting
domain: finance
layer: gold
description: Certified Finance dataset for recognized net revenue reporting and quarterly financial analysis.
grain: fiscal period, legal entity, sales region, and product brand
target_users: [finance analysts, finance leadership, executive reporting]
supported_use_cases: [financial reporting, quarter-end reporting, executive finance analysis]
prohibited_use_cases: [operational order performance monitoring]
certification: certified
owner: finance analytics
metric_ids: [metric.finance_net_revenue]
entity_ids: [entity.customer, entity.product]
dimension_concept_ids: [business_concept.region, business_concept.product]
freshness_sla: daily by 08:00 UTC
refresh_cadence: daily
trust_signals: [reconciled to general ledger, certified for external reporting]
columns:
  - {name: fiscal_quarter, type: "VARCHAR", nullable: false, description: "Fiscal quarter as YYYY-Qn (fiscal year equals calendar year)"}
  - {name: legal_entity, type: "VARCHAR", nullable: false, description: "Booking legal entity"}
  - {name: sales_region, type: "VARCHAR", nullable: false, description: "Sales region"}
  - {name: product_brand, type: "VARCHAR", nullable: false, description: "Product brand"}
  - {name: recognized_net_revenue, type: "DECIMAL(18,2)", nullable: false, description: "Recognized revenue net of return reversals"}
  - {name: revenue_event_count, type: "BIGINT", nullable: false, description: "Revenue events in the period"}
