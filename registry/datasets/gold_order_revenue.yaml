id: gold.order_revenue
name: Completed order revenue by region
domain: operations
layer: gold
description: Certified operational dataset for completed-order net revenue, order performance, and regional sales analysis.
grain: completed order line and sales region
target_users: [sales operations, order operations, regional managers]
supported_use_cases: [operational performance monitoring, sales performance analysis, regional order analysis]
prohibited_use_cases: [external financial reporting, accounting recognition]
certification: certified
owner: sales operations analytics
metric_ids: [metric.operations_net_revenue]
entity_ids: [entity.order, entity.customer, entity.product]
dimension_concept_ids: [business_concept.region, business_concept.product]
freshness_sla: hourly within 90 minutes
refresh_cadence: hourly
trust_signals: [completed-order reconciliation, certified operations KPI]
columns:
  - {name: order_key, type: "BIGINT", nullable: false, description: "Completed order"}
  - {name: line_number, type: "INTEGER", nullable: false, description: "Order line number"}
  - {name: customer_key, type: "BIGINT", nullable: false, description: "Customer"}
  - {name: part_key, type: "BIGINT", nullable: false, description: "Product"}
  - {name: product_brand, type: "VARCHAR", nullable: false, description: "Product brand"}
  - {name: sales_region, type: "VARCHAR", nullable: false, description: "Sales region"}
  - {name: order_date, type: "DATE", nullable: false, description: "Order date"}
  - {name: completed_date, type: "DATE", nullable: false, description: "Customer receipt date of the line"}
  - {name: net_revenue, type: "DECIMAL(18,2)", nullable: false, description: "Completed-order net revenue"}
