name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and lint tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,data,dbt]"
          python -m pip install ruff==0.16.8

      - name: Validate semantic registry
        run: python -m ai_data_platform validate

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate pipeline specs
        run: python -m ai_data_platform pipelines validate

      - name: Pipeline and dbt smoke test (TPC-H scale 0.01)
        run: |
          python -m ai_data_platform sample-data tpch --scale 0.01 --data-dir "$RUNNER_TEMP/data"
          python -m ai_data_platform pipelines --state-dir "$RUNNER_TEMP/state" --data-dir "$RUNNER_TEMP/data" run --ingest
          python -m ai_data_platform pipelines --state-dir "$RUNNER_TEMP/state" export-dbt --output "$RUNNER_TEMP/dbt"
          dbt build --project-dir "$RUNNER_TEMP/dbt" --profiles-dir "$RUNNER_TEMP/dbt"

      - name: Lint
        run: ruff check .
