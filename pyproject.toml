[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-native-data-platform"
version = "0.5.0"
description = "Vendor-neutral semantic context platform with governed agent tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "mcp>=2.2,<2.3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
ai-data-platform = "ai_data_platform.__main__:main"
ai-data-platform-mcp = "ai_data_platform.mcp.server:main"

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_data_platform"]

[tool.ruff]
line-length = 100
