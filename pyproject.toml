[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-native-data-platform"
version = "0.1.0"
description = "Vendor-neutral semantic registry and deterministic dataset discovery baseline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_data_platform"]

[tool.ruff]
line-length = 100
